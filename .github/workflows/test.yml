name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    # Linux, not macOS: the unit suite mocks all Mail and Keychain I/O, and
    # GitHub's macOS arm64 runners were repeatedly unavailable ("job was not
    # acquired by Runner"), cancelling runs after 15 minutes with no step
    # executed. The macOS leg below still runs when a machine is free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - run: uv python install 3.10

      - run: uv sync --dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/ -m "not integration and not e2e and not benchmark" -v --cov=apple_mail_fast_mcp --cov-report=term-missing --cov-fail-under=90
        # The unit suite runs in seconds (~13s in CI incl. coverage). A tight
        # cap is a backstop against a real-I/O leak that stalls in CI (#298,
        # #408). The primary defense is now the autouse `_block_real_io` guard
        # in tests/unit/conftest.py, which fails such leaks fast; this cap
        # just bounds a pathological hang. Keep it tight.
        timeout-minutes: 3

      - name: Complexity check
        run: ./scripts/check_complexity.sh

      - name: Offline MCP tool smoke tests
        run: make smoke
        timeout-minutes: 3

      - name: Version sync check
        run: ./scripts/check_version_sync.sh

      - name: Client-server parity check
        run: ./scripts/check_client_server_parity.sh

      - name: Docs drift check
        run: ./scripts/check_docs.sh

  unit-tests-macos:
    # The platform the server actually runs on. Not required: it must not
    # block a merge when GitHub has no macOS machine to give.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - run: uv python install 3.10

      - run: uv sync --dev

      - name: Unit tests
        run: uv run pytest tests/ -m "not integration and not e2e and not benchmark" -q
        timeout-minutes: 3

  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
